name: 🐞 Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: [fehler]
body:
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, was hast du erwartet, was ist stattdessen passiert?
    validations:
      required: true
  - type: input
    id: wo
    attributes:
      label: Wo im Kurs?
      placeholder: z. B. Kapitel 3 „Fang-Spiel“, Schritt „Gefangen!“ – oder Scratch-Tutorial „Pong“
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Brave, Chrome, Edge, anderer]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version der Erweiterung
      description: Steht unter brave://extensions bei der Erweiterung.
      placeholder: z. B. 1.2.0
  - type: textarea
    id: bild
    attributes:
      label: Screenshot
      description: Ein Bildschirmfoto hilft sehr. Einfach hier hineinziehen.
